<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Application interaction flow</title><desc id="desc">Visitor enters activity values in Streamlit widgets, Python calculates illustrative estimates, and results are rendered.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#466"/></marker></defs><rect width="1000" height="300" rx="18" fill="#f4f7f5"/><g font-family="Arial" text-anchor="middle" font-size="18" fill="#173b2a" stroke="#397a57" stroke-width="2"><rect x="25" y="95" width="185" height="90" rx="12" fill="#e2f1e8"/><rect x="275" y="95" width="185" height="90" rx="12" fill="#e2f1e8"/><rect x="525" y="95" width="185" height="90" rx="12" fill="#e2f1e8"/><rect x="775" y="95" width="200" height="90" rx="12" fill="#e2f1e8"/><g stroke="none" font-weight="bold"><text x="117" y="135">Visitor browser</text><text x="367" y="135">Streamlit widgets</text><text x="617" y="135">Python calculation</text><text x="875" y="135">Category + total</text><text x="875" y="160">estimates</text></g></g><g stroke="#466" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M210 140 H267"/><path d="M460 140 H517"/><path d="M710 140 H767"/></g><g font-family="Arial" text-anchor="middle" fill="#4c5c55" font-size="14"><text x="240" y="78">Activity inputs</text><text x="490" y="78">Widget values</text><text x="740" y="78">Calculated output</text><text x="500" y="240" font-size="16">Illustrative factors only. No database or public application API is implemented.</text></g></svg>