<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Calculation data flow</title><desc id="desc">Four activity inputs are annualized, multiplied by example factors, converted to tonnes, and displayed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#456"/></marker></defs><rect width="1000" height="340" rx="18" fill="#f5f7fa"/><g font-family="Arial" text-anchor="middle" fill="#18334d" stroke="#426a91" stroke-width="2"><rect x="25" y="60" width="210" height="210" rx="12" fill="#e4edf8"/><rect x="295" y="115" width="175" height="105" rx="12" fill="#e4edf8"/><rect x="530" y="115" width="175" height="105" rx="12" fill="#e4edf8"/><rect x="765" y="115" width="205" height="105" rx="12" fill="#e4edf8"/><g stroke="none" font-size="16" font-weight="bold"><text x="130" y="95">Activity inputs</text><text x="382" y="155">Annualize</text><text x="617" y="150">Apply example</text><text x="617" y="174">factors</text><text x="867" y="150">Convert and</text><text x="867" y="174">round</text></g><g stroke="none" font-size="13"><text x="130" y="130">Daily commute km</text><text x="130" y="160">Monthly electricity kWh</text><text x="130" y="190">Meals per day</text><text x="130" y="220">Weekly waste kg</text><text x="382" y="190">365 / 12 / 365 / 52</text><text x="617" y="200">kg CO₂ per activity unit</text><text x="867" y="200">kg ÷ 1,000</text></g></g><g stroke="#456" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M235 165 H287"/><path d="M470 165 H522"/><path d="M705 165 H757"/></g><text x="500" y="315" text-anchor="middle" font-family="Arial" fill="#344e66" font-size="16" font-weight="bold">Category values and summed annual estimate</text></svg>