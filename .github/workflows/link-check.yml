name: Markdown link validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate relative Markdown links
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          files = [Path("README.md"), *Path("docs").rglob("*.md"),
                   *Path(".github").rglob("*.md")]
          pattern = re.compile(r'(?<!!)\[[^\]]+\]\(([^)]+)\)')
          failures = []
          for source in files:
              for raw in pattern.findall(source.read_text(encoding="utf-8")):
                  target = raw.strip()
                  if target.startswith(("https://", "http://", "mailto:", "#")):
                      continue
                  local = target.split("#", 1)[0].split("?", 1)[0]
                  if local and not (source.parent / local).resolve().exists():
                      failures.append(f"{source}: {target}")
          if failures:
              print("Broken local links:\n" + "\n".join(failures))
              sys.exit(1)
          print(f"Validated {len(files)} Markdown files.")
