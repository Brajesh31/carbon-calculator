name: Feature request
description: Suggest a user-focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, privacy, accessibility, and maintenance impact
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
